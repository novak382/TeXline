[001]
name=pdfLaTeX
program=C:/texlive/2023/bin/windows/latexmk.exe
arguments=-pdf, -synctex=1, -interaction=nonstopmode, -file-line-error, $fullname
showPdf=true

[002]
name=XeLaTeX
program=C:/texlive/2023/bin/windows/latexmk.exe
arguments=-xelatex, -synctex=1, -interaction=nonstopmode, -file-line-error, $fullname
showPdf=true

[003]
name=LuaLaTeX
program=C:/texlive/2023/bin/windows/latexmk.exe
arguments=-lualatex, -synctex=1, -interaction=nonstopmode, -file-line-error, $fullname
showPdf=true

[004]
name=BibTeX
program=C:/texlive/2023/bin/windows/bibtex.exe
arguments=$basename
showPdf=false

[005]
name=Biber
program=C:/texlive/2023/bin/windows/biber.exe
arguments=$basename
showPdf=false
